name: Validate VENORA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/product-variant-combinations]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
